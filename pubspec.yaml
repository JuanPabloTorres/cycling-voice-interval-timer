name: cycling_voice_interval_timer
description: "RidePulse - Interval Timer for Cyclists"
publish_to: 'none'
version: 1.0.1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  provider: ^6.1.2
  
  # Text-to-Speech
  flutter_tts: ^4.2.0
  
  # Audio focus management
  audio_session: ^0.1.21
  
  # Database
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  
  # Web persistence (localStorage)
  shared_preferences: ^2.5.3
  
  # UUID generation
  uuid: ^4.5.1
  
  # Wakelock (keep screen on during timer)
  wakelock_plus: ^1.3.0
  
  # Lottie animations
  lottie: ^3.1.3
  
  # Foreground notifications
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/ridepulse3.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/ridepulse3.png"
    background_color: "#1A1A2E"
    theme_color: "#00D9FF"
  windows:
    generate: true
    image_path: "assets/icon/ridepulse3.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/ridepulse3.png"

flutter_native_splash:
  color: "#1A1A2E"
  image: assets/icon/ridepulse3.png
  color_dark: "#0D0D1A"
  image_dark: assets/icon/ridepulse3.png
  
  android_12:
    color: "#1A1A2E"
    icon_background_color: "#1A1A2E"
    image: assets/icon/ridepulse3.png
    color_dark: "#0D0D1A"
    icon_background_color_dark: "#0D0D1A"
    image_dark: assets/icon/ridepulse3.png
  
  web: true
  
flutter:
  uses-material-design: true
  
  assets:
    - assets/icon/
    - assets/lottie/
